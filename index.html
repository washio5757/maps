<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAPS - Google Maps View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* 桃色（#fbc2eb）から藤色（#a6c1ee）へのグラデーション */
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      background-attachment: fixed;
      color: #333;
      padding: 20px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 32px 0 rgba(166, 193, 238, 0.37);
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      color: #222;
      letter-spacing: 0.05em;
    }

    p.subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 2rem;
    }

    /* 検索エリア */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(4px);
      outline: none;
      font-size: 0.95rem;
      color: #333;
    }

    input[type="text"]::placeholder {
      color: #777;
    }

    button {
      padding: 0.8rem 1.5rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.6);
      color: #333;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }

    /* ショートカットボタン */
    .shortcut-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.5rem;
      justify-content: center;
    }

    .chip-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.25);
      font-size: 0.85rem;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* マップ埋め込みコンテナ */
    .map-container {
      width: 100%;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <main class="glass-card">
    <h1>MAPS</h1>
    <p class="subtitle">Google Maps Search & Viewer</p>

    <!-- 検索フォーム -->
    <div class="search-box">
      <input type="text" id="locationInput" placeholder="場所・施設名を入力（例: 東京タワー, 富士山）" onkeydown="if(event.key==='Enter') updateMap()">
      <button onclick="updateMap()">検索</button>
    </div>

    <!-- ショートカットボタン -->
    <div class="shortcut-buttons">
      <button class="chip-btn" onclick="setMap('東京駅')">東京駅</button>
      <button class="chip-btn" onclick="setMap('大阪駅')">大阪駅</button>
      <button class="chip-btn" onclick="setMap('富士山')">富士山</button>
      <button class="chip-btn" onclick="setMap('金閣寺')">金閣寺</button>
      <button class="chip-btn" onclick="setMap('沖縄美ら海水族館')">美ら海水族館</button>
    </div>

    <!-- Google Map 埋め込みエリア -->
    <div class="map-container">
      <iframe 
        id="mapIframe"
        src="https://maps.google.com/maps?q=東京駅&t=&z=14&ie=UTF8&iwloc=&output=embed"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <script>
    function updateMap() {
      const input = document.getElementById('locationInput').value.trim();
      if (input) {
        setMap(input);
      }
    }

    function setMap(query) {
      const iframe = document.getElementById('mapIframe');
      iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=14&ie=UTF8&iwloc=&output=embed`;
    }
  </script>

</body>
</html>
